# Dex — local OIDC identity provider for Agent Gateway development.
#
# This is the "user identity" half of the story: Dex authenticates a human and
# issues an ID token; Agent Gateway's authz service verifies that token and
# binds every delegation to its subject. This file is the *only* place that
# knows about a specific identity provider — production swaps it for a real IdP
# (Okta, Entra ID, Keycloak) or an upstream connector, with no Go changes.
#
# Start it with:  make dex-up      (or ./scripts/infra.sh up)
#
# Hardened Dex configuration template. Generate the runtime file with
# `python3 demo/configure-idp.py`; it reads provider credentials from demo/.env
# and writes the ignored demo/dex/config.hardened.yaml.
# There is intentionally no built-in account in this config.

issuer: DEX_ISSUER_URL

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  # No "grant this app access?" interstitial.
  skipApprovalScreen: true

# A public OAuth client — no secret, because the web UI and scripts cannot keep
# one. This is the same shape a PKCE-aware SPA/native client uses. In production
# give real clients a secret and require PKCE.
staticClients:
  - id: agent-gateway
    name: Agent Gateway
    public: true
    redirectURIs:
      - http://localhost:8083/oidc/callback
      - http://127.0.0.1:8083/oidc/callback
      # MCP One Ring OAuth connector flow (gateway + gateway-mcp): the IdP
      # sends the signed-in browser back to the gateway's OAuth callback.
      - http://localhost:8080/oauth/idpcallback
      - http://127.0.0.1:8080/oauth/idpcallback
      - http://localhost:8085/oauth/idpcallback
      - http://127.0.0.1:8085/oauth/idpcallback
      - http://localhost:8086/oauth/idpcallback
      - http://127.0.0.1:8086/oauth/idpcallback
      # DEX_DYNAMIC_REDIRECTS

# Keep Dex's local connector configured but empty so the provider starts without
# offering a usable account. Add a real upstream connector for sign-in.
enablePasswordDB: true
staticPasswords: []

# The setup script inserts one real Google or Microsoft connector below. Do not
# put credentials in this tracked template.
# DEX_CONNECTOR_BLOCK
