# Dex — local OIDC identity provider for Agent Gateway development.
#
# This is the "user identity" half of the story: Dex authenticates a human and
# issues an ID token; Agent Gateway's authz service verifies that token and
# binds every delegation to its subject. This file is the *only* place that
# knows about a specific identity provider — production swaps it for a real IdP
# (Okta, Entra ID, Keycloak) or an upstream connector, with no Go changes.
#
# Start it with:  make dex-up      (or ./scripts/infra.sh up)
#
# Two ways to get a token locally:
#   1. Browser:  click "Sign in with Dex" in the web UI. Uses the mockCallback
#      connector, so it is a single click with no credentials.
#   2. Headless: scripts/oidc-token.sh alice   — uses the password grant with
#      one of the static passwords below.

issuer: http://dex:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  # No "grant this app access?" interstitial; a local login is one step.
  skipApprovalScreen: true
  # Which connector verifies passwords for the Resource Owner Password grant.
  # Setting this is what enables the password grant (used by oidc-token.sh).
  passwordConnector: local

# A public OAuth client — no secret, because the web UI and scripts cannot keep
# one. This is the same shape a PKCE-aware SPA/native client uses. In production
# give real clients a secret and require PKCE.
staticClients:
  - id: agent-gateway
    name: Agent Gateway
    public: true
    redirectURIs:
      - http://localhost:8083/oidc/callback
      # LAN addresses for multi-device approval notifications (the Telegram
      # card's "Open the console" link lands on the console from whichever
      # device the approver uses). Add one per host/port that can serve the
      # console; in production the console sits behind a single TLS name.
      - http://192.168.1.53:8083/oidc/callback

# Static users for the password grant. The hash is bcrypt of "password". These
# are development fixtures, never real credentials.
enablePasswordDB: true
staticPasswords:
  - email: "alice@example.com"
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"  # password
    username: "alice"
    userID: "alice"
  - email: "bob@example.com"
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"  # password
    username: "bob"
    userID: "bob"
  - email: "carol@example.com"   # a second fixture so demos can show a
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"  # password
    username: "carol"            # DIFFERENT human being refused by the
    userID: "carol"              # approver binding (403) — by design
  - email: "eve@example.com"
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"  # password
    username: "eve"
    userID: "eve"
  - email: "bob@example.com"
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: "bob"
    userID: "bob"

connectors:
  # mockCallback needs no interaction and always signs in as a fixed test user,
  # making the browser flow a single click.
  - type: mockCallback
    id: mock
    name: "Mock (dev)"

  # --- Swap in a real identity provider for production ---------------------
  # Each entry below replaces (or joins) the mock connector; the Go code does
  # not change. Values starting with "$" are read from the environment.
  #
  # - type: oidc                       # upstream OIDC (Okta, Auth0, Entra…)
  #   id: corporate
  #   name: Corporate SSO
  #   config:
  #     issuer: https://login.example.com/
  #     clientID: $DEX_UPSTREAM_CLIENT_ID
  #     clientSecret: $DEX_UPSTREAM_CLIENT_SECRET
  #     redirectURI: http://localhost:5556/dex/callback
  #
  # - type: ldap                       # Active Directory / OpenLDAP
  #   id: ldap
  #   name: Directory
  #   config:
  #     host: ldap.example.com:636
  #     bindDN: cn=dex,dc=example,dc=com
  #     bindPW: $DEX_LDAP_BIND_PW
  #     userSearch:
  #       baseDN: ou=people,dc=example,dc=com
  #       filter: "(objectClass=person)"
  #       username: uid
  #       idAttr: uid
  #       emailAttr: mail
  #       nameAttr: cn
  #
  # - type: saml                       # SAML 2.0 partner
  #   id: saml
  #   name: Partner
  #   config:
  #     ssoURL: https://sso.example.com/saml
