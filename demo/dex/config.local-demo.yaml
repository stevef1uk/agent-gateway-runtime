# Loopback-only local demo identity provider. The default Compose file binds all
# published ports to 127.0.0.1. Never use these shared credentials for
# deployment or security testing.

issuer: http://dex:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true
  grantTypes:
    - "authorization_code"
    - "password"
  passwordConnector: local

staticClients:
  - id: agent-gateway
    name: Agent Gateway local demo
    public: true
    redirectURIs:
      - http://localhost:8083/oidc/callback
      - http://127.0.0.1:8083/oidc/callback
      - http://localhost:8080/oauth/idpcallback
      - http://127.0.0.1:8080/oauth/idpcallback
      - http://localhost:8085/oauth/idpcallback
      - http://127.0.0.1:8085/oauth/idpcallback
      - http://localhost:8086/oauth/idpcallback
      - http://127.0.0.1:8086/oauth/idpcallback

enablePasswordDB: true
staticPasswords:
  - email: "alice@example.com"
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: "alice"
    userID: "alice"
