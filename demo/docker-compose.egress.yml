# Demo 5 — egress enforcement overlay (gateway images >= 1.0.22).
#
#   docker compose -f docker-compose.yml -f docker-compose.egress.yml up -d
#
# Enables gateway egress forward proxy: set GATEWAY_PROXY_ADDR and
# point the approval cards' console deep-link at a routable URL.
#
# DEMO_CONSOLE_URL is used by the approval Telegram cards / webhook payloads
# ("Open the console to decide") — Telegram refuses `localhost` in buttons,
# so machines reached from other devices should set it to their LAN address,
# e.g. DEMO_CONSOLE_URL=http://192.168.1.53:8083 compose -f ... up -d.
#
# With this overlay the guided demos stay on the built-in egress policy =
# no extra approval rules for existing flows; enable the all-outbound rule
# with a delegation carrying approval_rules: [{when:{resource_pattern:*}}]
# — demo/egress-demo.sh does exactly that, and routes real requests
# through the proxy as a scripted walkthrough.
services:
  gateway:
    environment:
      - GATEWAY_ADDR=0.0.0.0:8080
      - GATEWAY_PROXY_ADDR=0.0.0.0:8088
      - APPROVAL_CONSOLE_URL=${DEMO_CONSOLE_URL:-http://localhost:8083}
      # Basic Proxy-Authorization (token as username) for OpenShell's
      # upstream proxy: its proxy_auth_file carries a static "token:pass"
      # credential. Off unless enabled; source-restricted by CIDR.
      - PROXY_BASIC_AUTH=${PROXY_BASIC_AUTH:-1}
      # Connections arriving via the Docker userland proxy are seen as the
      # compose network's gateway IP (e.g. 172.26.0.1 for demo_default), not
      # 127.0.0.1 — allow the RFC1918 block docker networks live in.
      - PROXY_BASIC_AUTH_CIDRS=${PROXY_BASIC_AUTH_CIDRS:-127.0.0.0/8,::1/128,172.16.0.0/12}
