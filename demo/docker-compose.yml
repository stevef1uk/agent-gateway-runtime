# Agent Gateway local demo stack.
#
#   cd demo && ./ensure-secrets.sh && docker compose up -d --build
#   ./demo.sh                  (scripted walkthrough)
#   open http://localhost:8083/demo.html   (graphical walkthrough)
#
# This default is a loopback-only local demo with a shared Dex test account.
# It is intentionally insecure and must not be used for pen testing or
# deployment. Use docker-compose.hardened.yml with a real IdP for those cases.

services:
  authz:
    image: ${AUTHZ_IMAGE:-docker.io/stevef1uk/agent-gateway-authz:1.0.16@sha256:a0ce26b4f5fabae96e084d15b9777c4a730c6e530c1c4e5393e7ea170b22357f}
    container_name: agent-gateway-authz
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports: ["127.0.0.1:8081:8081"]
    environment:
      - PERSISTENCE=postgres
      - DATABASE_URL=postgres://agentgw:agentgw@postgres:5432/agent_gateway?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:?Set a high-entropy JWT_SECRET in demo/.env}
      - JWT_ISSUER=agent-gateway
      - TOKEN_TTL=5m
      - OIDC_ISSUER_URL=${DEX_ISSUER_URL:-http://dex:5556/dex}
      - OIDC_CLIENT_ID=agent-gateway
      - AUTHZ_READ_TOKEN=${AUTHZ_READ_TOKEN:-agent-gateway-demo-authz-read}
    volumes:
      - ./keys:/keys:ro
      - ./keys/license.token:/licences/authz.token:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      dex: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  tokensvc:
    image: ${TOKENSVC_IMAGE:-docker.io/stevef1uk/agent-gateway-tokensvc:1.0.10@sha256:e62ede0ee3a8308ccc5a060d95b9b2159f34b653b56514f3102833a8b5faff1c}
    container_name: agent-gateway-tokensvc
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports: ["127.0.0.1:8082:8082"]
    environment:
      - JWT_SECRET=${JWT_SECRET:?Set a high-entropy JWT_SECRET in demo/.env}
      - JWT_ISSUER=agent-gateway
      - TOKEN_TTL=5m
      - AUTHZ_URL=http://authz:8081
      - AUTHZ_READ_TOKEN=${AUTHZ_READ_TOKEN:-agent-gateway-demo-authz-read}
    volumes:
      - ./keys:/keys:ro
      - ./keys/license.token:/licences/tokensvc.token:ro
    depends_on:
      authz: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8082/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    image: ${GATEWAY_IMAGE:-docker.io/stevef1uk/agent-gateway-gateway:1.0.36@sha256:2dce006ce0b53bdeb57525b3d993809fbc802a24e1dcfd39e46dde1a4ee72ce8}
    container_name: agent-gateway-gateway
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    # GATEWAY_HOST_PORT overrides the published PEP port (default 8080) when
    # something else already owns :8080 on the host, e.g. an OpenShell gateway.
    # Keep host-local access and expose only the Docker bridge address so
    # isolated test containers can reach the pen-test target without opening
    # the gateway on every host interface.
    ports: ["127.0.0.1:${GATEWAY_HOST_PORT:-8080}:8080", "172.17.0.1:${GATEWAY_HOST_PORT:-8080}:8080", "127.0.0.1:8088:8088"]
    environment:
      - AUTHZ_URL=http://authz:8081
      - AUTHZ_READ_TOKEN=${AUTHZ_READ_TOKEN:-agent-gateway-demo-authz-read}
      - PERSISTENCE=postgres
      - DATABASE_URL=postgres://agentgw:agentgw@postgres:5432/agent_gateway?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:?Set a high-entropy JWT_SECRET in demo/.env}
      - JWT_ISSUER=agent-gateway
      - GATEWAY_ADMIN_TOKEN=${GATEWAY_ADMIN_TOKEN:?Run ./ensure-secrets.sh from demo/}
      - APPROVAL_TTL=${APPROVAL_TTL:-15m}             # honored only by gateway images that implement this setting
      # Egress enforcement (OpenShell/OpenClaw): uncomment to route ALL of an
      # agent's outbound traffic through the gateway — one delegated, audited,
      # approval-gated decision per destination. See demo/egress-demo.sh and
      # docs/OpenShell guide in the main repo. Default: off (behaviour
      # unchanged from 1.0.21 unless enabled).
      # - GATEWAY_PROXY_ADDR=:8088
      # Real downstream: the demo protected API (executed_count proves how
      # often it ran). Remove to restore the gateway's synthetic echo.
      - UPSTREAM_URL=http://demoapi:8090
      # Telegram approval notifications: values come from demo/.env (gitignored)
      # exported via the shell env; empty = channel off. Run compose FROM THIS
      # DIRECTORY so demo/.env is picked up (or export the variables yourself).
      # If your host only has the standalone binary, use `docker-compose`
      # instead of `docker compose`.
      - APPROVAL_TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - APPROVAL_TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - APPROVAL_CONSOLE_URL=${APPROVAL_CONSOLE_URL:-}   # must be ROUTABLE by the recipient (Telegram rejects localhost in buttons)
      # - APPROVAL_WEBHOOK_URL=http://n8n:5678/webhook/agent-gateway   # push approval.required events (Deployment Guide §7.5 / product Deployment.md §7.5)
      # - APPROVAL_WEBHOOK_SECRET=<random 32 bytes>                    # HMAC-signs each delivery
      # - APPROVAL_TELEGRAM_BOT_TOKEN=<token from @BotFather>          # push approval.required to a Telegram chat (same event as the webhook)
      # - APPROVAL_TELEGRAM_CHAT_ID=<user or group id>
    volumes:
      - ./keys:/keys:ro
      - ./keys/license.token:/licences/gateway.token:ro
    depends_on:
      authz: { condition: service_started }
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Dedicated API PEP for the Console's catalog-demo example. Local Compose
  # does not dynamically provision PEPs for arbitrary Wizard entries.
  gateway-api-catalog-demo:
    image: ${GATEWAY_IMAGE:-docker.io/stevef1uk/agent-gateway-gateway:1.0.36@sha256:2dce006ce0b53bdeb57525b3d993809fbc802a24e1dcfd39e46dde1a4ee72ce8}
    container_name: agent-gateway-gateway-api-catalog-demo
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      - AUTHZ_URL=http://authz:8081
      - AUTHZ_READ_TOKEN=${AUTHZ_READ_TOKEN:-agent-gateway-demo-authz-read}
      - PERSISTENCE=postgres
      - DATABASE_URL=postgres://agentgw:agentgw@postgres:5432/agent_gateway?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:?Set a high-entropy JWT_SECRET in demo/.env}
      - JWT_ISSUER=agent-gateway
      - GATEWAY_ADMIN_TOKEN=${GATEWAY_ADMIN_TOKEN:?Run ./ensure-secrets.sh from demo/}
      - UPSTREAM_PATH_PREFIX=/api-catalog-demo
      - UPSTREAM_URL=${CATALOG_DEMO_UPSTREAM_URL:-https://jsonplaceholder.typicode.com}
    volumes:
      - ./keys:/keys:ro
      - ./keys/license.token:/licences/gateway.token:ro
    depends_on:
      authz: { condition: service_started }
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Dedicated API PEP for the Console's Open-Meteo Geocoding example.
  gateway-api-geocoding:
    image: ${GATEWAY_IMAGE:-docker.io/stevef1uk/agent-gateway-gateway:1.0.36@sha256:2dce006ce0b53bdeb57525b3d993809fbc802a24e1dcfd39e46dde1a4ee72ce8}
    container_name: agent-gateway-gateway-api-geocoding
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      - AUTHZ_URL=http://authz:8081
      - AUTHZ_READ_TOKEN=${AUTHZ_READ_TOKEN:-agent-gateway-demo-authz-read}
      - PERSISTENCE=postgres
      - DATABASE_URL=postgres://agentgw:agentgw@postgres:5432/agent_gateway?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:?Set a high-entropy JWT_SECRET in demo/.env}
      - JWT_ISSUER=agent-gateway
      - GATEWAY_ADMIN_TOKEN=${GATEWAY_ADMIN_TOKEN:?Run ./ensure-secrets.sh from demo/}
      # The governed route includes the service name; remove it before
      # forwarding to Open-Meteo's /v1/search endpoint.
      - UPSTREAM_PATH_PREFIX=/api-geocoding
      - UPSTREAM_URL=${GEOCODING_API_UPSTREAM_URL:-https://geocoding-api.open-meteo.com}
    volumes:
      - ./keys:/keys:ro
      - ./keys/license.token:/licences/gateway.token:ro
    depends_on:
      authz: { condition: service_started }
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Dedicated API PEP for the Console's JSONPlaceholder Users example.
  gateway-api-users:
    image: ${GATEWAY_IMAGE:-docker.io/stevef1uk/agent-gateway-gateway:1.0.36@sha256:2dce006ce0b53bdeb57525b3d993809fbc802a24e1dcfd39e46dde1a4ee72ce8}
    container_name: agent-gateway-gateway-api-users
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      - AUTHZ_URL=http://authz:8081
      - AUTHZ_READ_TOKEN=${AUTHZ_READ_TOKEN:-agent-gateway-demo-authz-read}
      - PERSISTENCE=postgres
      - DATABASE_URL=postgres://agentgw:agentgw@postgres:5432/agent_gateway?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:?Set a high-entropy JWT_SECRET in demo/.env}
      - JWT_ISSUER=agent-gateway
      - GATEWAY_ADMIN_TOKEN=${GATEWAY_ADMIN_TOKEN:?Run ./ensure-secrets.sh from demo/}
      - UPSTREAM_PATH_PREFIX=/api-users
      - UPSTREAM_URL=${USERS_API_UPSTREAM_URL:-https://jsonplaceholder.typicode.com}
    volumes:
      - ./keys:/keys:ro
      - ./keys/license.token:/licences/gateway.token:ro
    depends_on:
      authz: { condition: service_started }
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Dedicated API PEP for the Wizard's local demo Refunds endpoint.
  # demoapi's counting echo accepts /refunds and makes approval execution
  # visible; JSONPlaceholder does not implement a /refunds resource.
  gateway-api-refunds:
    image: ${GATEWAY_IMAGE:-docker.io/stevef1uk/agent-gateway-gateway:1.0.36@sha256:2dce006ce0b53bdeb57525b3d993809fbc802a24e1dcfd39e46dde1a4ee72ce8}
    container_name: agent-gateway-gateway-api-refunds
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      - AUTHZ_URL=http://authz:8081
      - AUTHZ_READ_TOKEN=${AUTHZ_READ_TOKEN:-agent-gateway-demo-authz-read}
      - PERSISTENCE=postgres
      - DATABASE_URL=postgres://agentgw:agentgw@postgres:5432/agent_gateway?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:?Set a high-entropy JWT_SECRET in demo/.env}
      - JWT_ISSUER=agent-gateway
      - GATEWAY_ADMIN_TOKEN=${GATEWAY_ADMIN_TOKEN:?Run ./ensure-secrets.sh from demo/}
      - UPSTREAM_PATH_PREFIX=/api-refunds
      - UPSTREAM_URL=http://demoapi:8090
    volumes:
      - ./keys:/keys:ro
      - ./keys/license.token:/licences/gateway.token:ro
    depends_on:
      authz: { condition: service_started }
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      demoapi: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Demo 9 — CRM MCP server PEP. UPSTREAM_URL is per-instance,
  # so MCP CRM traffic gets its own PEP here: /mcp in, mcpsrv:8091 out.
  gateway-mcp:
    image: ${GATEWAY_IMAGE:-docker.io/stevef1uk/agent-gateway-gateway:1.0.36@sha256:2dce006ce0b53bdeb57525b3d993809fbc802a24e1dcfd39e46dde1a4ee72ce8}
    container_name: agent-gateway-gateway-mcp
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    # GATEWAY_MCP_HOST_PORT overrides the published host port (default 8085).
    ports: ["127.0.0.1:${GATEWAY_MCP_HOST_PORT:-8085}:8080"]
    environment:
      - AUTHZ_URL=http://authz:8081
      - AUTHZ_READ_TOKEN=${AUTHZ_READ_TOKEN:-agent-gateway-demo-authz-read}
      - PERSISTENCE=postgres
      - DATABASE_URL=postgres://agentgw:agentgw@postgres:5432/agent_gateway?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      # Authz mints the bearer JWT returned by the Console for every PEP, so
      # every gateway must validate with Authz's shared signing key/issuer.
      - JWT_SECRET=${JWT_SECRET:?Set a high-entropy JWT_SECRET in demo/.env}
      - GATEWAY_ADMIN_TOKEN=${GATEWAY_ADMIN_TOKEN:?Run ./ensure-secrets.sh from demo/}
      # CRM MCP server (Demo 9)
      - UPSTREAM_URL=http://mcpsrv:8091
      # MCP One Ring OAuth layer (Claude remote connector + any MCP client):
      # - OAUTH_ISSUER_URL is the URL clients (and claude.ai) reach; the demo
      #   publishes :8085 on the host.
      # - OIDC_ISSUER_URL (cluster name) drives code exchange/verification
      #   server-side; OAUTH_IDP_BROWSER_URL is what the human's browser opens.
      # Flip OAUTH_ENABLED off to run this instance JWT-only as before.
      - OAUTH_ENABLED=1
      # OAUTH_PUBLIC_BASE is the externally reachable base URL of this
      # gateway: the plain compose default is the published localhost port;
      # ./oauth-tunnel.sh overrides it (via .env) with an HTTPS tunnel URL
      # so claude.ai's cloud connector can reach the stack.
      - OAUTH_ISSUER_URL=${OAUTH_PUBLIC_BASE:-http://localhost:${GATEWAY_MCP_HOST_PORT:-8085}}
      - OIDC_ISSUER_URL=${DEX_ISSUER_URL:-http://dex:5556/dex}
      - OIDC_CLIENT_ID=agent-gateway
      - OIDC_CONNECTOR_ID=${OIDC_CONNECTOR_ID:-}
      - OAUTH_IDP_BROWSER_URL=http://localhost:5556/dex
      # MCP holds notify like every other gateway instance: without these the
      # only channel is the console poll (and the human may not be watching).
      - APPROVAL_TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - APPROVAL_TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - APPROVAL_CONSOLE_URL=${APPROVAL_CONSOLE_URL:-}   # console deep link on the hold card
      # No egress proxy on this instance — the MCP demo drives the PEP path.
    volumes:
      - ./keys:/keys:ro
      - ./keys/license.token:/licences/gateway.token:ro  # the image looks up the licence at this fixed name
    depends_on:
      authz: { condition: service_started }
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      mcpsrv: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Dedicated Gateway PEP fronting the Emotion Detection MCP server
  gateway-mcp-emotion:
    image: ${GATEWAY_IMAGE:-docker.io/stevef1uk/agent-gateway-gateway:1.0.36@sha256:2dce006ce0b53bdeb57525b3d993809fbc802a24e1dcfd39e46dde1a4ee72ce8}
    container_name: agent-gateway-gateway-mcp-emotion
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports: ["127.0.0.1:${GATEWAY_MCP_EMOTION_HOST_PORT:-8086}:8080"]
    environment:
      - AUTHZ_URL=http://authz:8081
      - AUTHZ_READ_TOKEN=${AUTHZ_READ_TOKEN:-agent-gateway-demo-authz-read}
      - PERSISTENCE=postgres
      - DATABASE_URL=postgres://agentgw:agentgw@postgres:5432/agent_gateway?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      # Authz mints the bearer JWT returned by the Console for every PEP, so
      # every gateway must validate with Authz's shared signing key/issuer.
      - JWT_SECRET=${JWT_SECRET:?Set a high-entropy JWT_SECRET in demo/.env}
      - GATEWAY_ADMIN_TOKEN=${GATEWAY_ADMIN_TOKEN:?Run ./ensure-secrets.sh from demo/}
      - UPSTREAM_URL=http://emotion-mcp:9000
      - OAUTH_ENABLED=1
      - OAUTH_ISSUER_URL=${OAUTH_PUBLIC_BASE_EMOTION:-http://localhost:${GATEWAY_MCP_EMOTION_HOST_PORT:-8086}}
      - OIDC_ISSUER_URL=${DEX_ISSUER_URL:-http://dex:5556/dex}
      - OIDC_CLIENT_ID=agent-gateway
      - OIDC_CONNECTOR_ID=${OIDC_CONNECTOR_ID:-}
      - OAUTH_IDP_BROWSER_URL=http://localhost:5556/dex
      - APPROVAL_TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - APPROVAL_TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - APPROVAL_CONSOLE_URL=${APPROVAL_CONSOLE_URL:-}
    volumes:
      - ./keys:/keys:ro
      - ./keys/license.token:/licences/gateway.token:ro
    depends_on:
      authz: { condition: service_started }
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      emotion-mcp: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  demoapi:
    image: ${DEMOAPI_IMAGE:-agent-gateway-demoapi:local}
    build:
      context: ./api
    pull_policy: build
    container_name: agent-gateway-demoapi
    restart: unless-stopped
    ports: ["127.0.0.1:8090:8090"]   # counter visible from the host: curl :8090/api/sensitive/wire
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8090/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Emotion Service (LLM Inference Engine) - Protected by secure_packager
  # In public docker-compose demo without customer_private.pem mounted,
  # the model remains encrypted and calls prompt the user to obtain a commercial license.
  emotion-api:
    image: ${EMOTION_IMAGE:-agent-gateway-emotion-service:local}
    build:
      context: ./emotion
      args:
        EMOTION_BASE_IMAGE: ${EMOTION_BASE_IMAGE:-stevef1uk/emotion-service:amd64}
    container_name: agent-gateway-emotion-api
    restart: unless-stopped
    ports: ["127.0.0.1:8000:8000"]
    environment:
      - MODEL_PATH=/app/model
      - GO_SERVER_PORT=8000
      - PRIVATE_KEY_PATH=/app/keys/customer_private.pem
      - TOKEN_FILE_PATH=/app/gemma3_emotion_model_unsloth/release/token.txt

  # Emotion Detection MCP Server (Go-based, dual Streamable-HTTP & SSE)
  emotion-mcp:
    image: ${MCP_IMAGE:-stevef1uk/emotion-mcp:latest}
    container_name: agent-gateway-emotion-mcp
    restart: unless-stopped
    ports: ["127.0.0.1:9000:9000"]
    environment:
      - EMOTION_SERVICE_URL=http://emotion-api:8000/predict
      - MCP_PORT=9000
      - MCP_TRANSPORT=dual
    depends_on:
      - emotion-api

  # Demo 9 — the protected MCP server (source: demo/mcp). Streamable-HTTP MCP
  # at /mcp + a read-only REST view of its in-memory CRM at /customers.
  mcpsrv:
    image: ${MCPSRV_IMAGE:-stevef1uk/agent-gateway-mcpsrv:1.0.1}
    container_name: agent-gateway-mcpsrv
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports: ["127.0.0.1:8091:8091"]   # MCP server visible from the host: curl :8091/customers
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8091/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    image: ${WEB_IMAGE:-docker.io/stevef1uk/agent-gateway-web:1.0.61@sha256:12c13a7240547ed43b7cd84c37d24b751d29a0b1eef5f3fb0095acd3b9f0cc4d}  # All built-in API Wizard examples
    container_name: agent-gateway-web
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports: ["127.0.0.1:8083:8083"]
    environment:
      - DATABASE_URL=postgres://agentgw:agentgw@postgres:5432/agent_gateway?sslmode=disable
      - AUTHZ_URL=http://authz:8081
      - AUTHZ_READ_TOKEN=${AUTHZ_READ_TOKEN:-agent-gateway-demo-authz-read}
      - GATEWAY_URL=http://gateway:8080
      - GATEWAY_MCP_URL=http://gateway-mcp:8080
      - TOKENSVC_URL=http://tokensvc:8082
      - OIDC_ISSUER_URL=${DEX_ISSUER_URL:-http://dex:5556/dex}
      - OIDC_CLIENT_ID=agent-gateway
      - OIDC_CONNECTOR_ID=${OIDC_CONNECTOR_ID:-}
      - WEB_PUBLIC_URL=${WEB_PUBLIC_URL:-http://localhost:8083}
      - WEB_ADDR=:8083
      - CATALOG_DEMO_UPSTREAM_URL=${CATALOG_DEMO_UPSTREAM_URL:-https://jsonplaceholder.typicode.com}
      - GEOCODING_API_UPSTREAM_URL=${GEOCODING_API_UPSTREAM_URL:-https://geocoding-api.open-meteo.com}
      - USERS_API_UPSTREAM_URL=${USERS_API_UPSTREAM_URL:-https://jsonplaceholder.typicode.com}
      # The signed Web image's built-in refunds example submits this URL.
      # Its Compose PEP is separately wired to demoapi for a working /refunds route.
      - REFUNDS_API_UPSTREAM_URL=${REFUNDS_API_UPSTREAM_URL:-https://jsonplaceholder.typicode.com}
      - GATEWAY_ADMIN_TOKEN=${GATEWAY_ADMIN_TOKEN:?Run ./ensure-secrets.sh from demo/}
      - PUBLIC_SIGNUP_ENABLED=0
      - WEB_ADMIN_EMAILS=${WEB_ADMIN_EMAILS:-alice@example.com}
      - DEMO_UI=1                     # serve the R&D pages (/demo.html, /policy.html); production omits this
      - FREERIDE_URL=http://freeride:11434/v1/chat/completions
      - FREERIDE_MODEL=${FREERIDE_MODEL:-gpt-4o}
      - FREERIDE_PROVIDER=${FREERIDE_PROVIDER:-FreeRide}
    volumes:
      - ./keys:/keys:ro
      - ./keys/license.token:/licences/web.token:ro
    depends_on:
      postgres: { condition: service_started }
      authz: { condition: service_started }
      gateway: { condition: service_started }
      gateway-api-catalog-demo: { condition: service_started }
      gateway-api-geocoding: { condition: service_started }
      gateway-api-users: { condition: service_started }
      gateway-api-refunds: { condition: service_started }
      gateway-mcp: { condition: service_started }
      gateway-mcp-emotion: { condition: service_started }
      freeride: { condition: service_started }
      tokensvc: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8083/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agent-gateway-redis
    restart: unless-stopped
    # No published ports: only the gateway stack reaches redis, over the
    # compose network (publishing 6379 would expose it to the LAN).
    volumes: [redis-data:/data]
    command: ["redis-server", "--appendonly", "yes"]

  postgres:
    image: postgres:16-alpine
    container_name: agent-gateway-postgres
    restart: unless-stopped
    # No published ports: only the gateway stack reaches postgres, over the
    # compose network (publishing 5432 would expose it to the LAN).
    environment:
      - POSTGRES_USER=agentgw
      - POSTGRES_PASSWORD=agentgw
      - POSTGRES_DB=agent_gateway
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentgw -d agent_gateway"]
      interval: 5s
      timeout: 3s
      retries: 10

  dex:
    image: ghcr.io/dexidp/dex:v2.46.0
    container_name: agent-gateway-dex
    restart: unless-stopped
    # configure-idp.py sets these to the owner of its mode-0600 config file.
    user: "${DEX_UID:-1001}:${DEX_GID:-1001}"
    ports: ["127.0.0.1:5556:5556"]
    volumes:
      - ./dex/config.local-demo.yaml:/etc/dex/config.yaml:ro
    command: ["dex", "serve", "/etc/dex/config.yaml"]

  freeride:
    image: ${FREERIDE_IMAGE:-stevef1uk/freeride:1.4.0}
    container_name: agent-gateway-freeride
    restart: unless-stopped
    ports: ["127.0.0.1:${FREERIDE_HOST_PORT:-11435}:11434"]
    environment:
      - PORT=11434
      # Configure whichever provider API keys you wish to use (passed from demo/.env)
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:11434/api/hello"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  redis-data:
  postgres-data:
