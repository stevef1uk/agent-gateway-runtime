# Agent Gateway public demo stack — 7 containers from Docker Hub.
#
#   cd demo && docker compose up -d
#   ./demo.sh                  (scripted walkthrough)
#   open http://localhost:8083/demo.html   (graphical walkthrough)
#
# All binaries run from the published images; the images carry encrypted
# payloads that need demo/keys/customer_private.pem + the vendor licence at
# runtime (see ../docs/Security-and-Licensing.md).

services:
  authz:
    image: stevef1uk/agent-gateway-authz:1.0.11  # 1.0.11 patched Go toolchain (govulncheck clean) + OPA 1.21.2
    container_name: agent-gateway-authz
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports: ["8081:8081"]
    environment:
      - PERSISTENCE=postgres
      - DATABASE_URL=postgres://agentgw:agentgw@postgres:5432/agent_gateway?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=agent-gateway-demo-secret-change-in-prod
      - JWT_ISSUER=agent-gateway
      - TOKEN_TTL=5m
      - OIDC_ISSUER_URL=http://dex:5556/dex
      - OIDC_CLIENT_ID=agent-gateway
    volumes:
      - ./keys:/keys:ro
      - ./keys/license.token:/licences/authz.token:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      dex: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  tokensvc:
    image: stevef1uk/agent-gateway-tokensvc:1.0.4  # 1.0.4 per-IP rate limit on /token + /token/exchange; patched toolchain
    container_name: agent-gateway-tokensvc
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports: ["8082:8082"]
    environment:
      - JWT_SECRET=agent-gateway-demo-secret-change-in-prod
      - JWT_ISSUER=agent-gateway
      - TOKEN_TTL=5m
      - AUTHZ_URL=http://authz:8081
    volumes:
      - ./keys:/keys:ro
      - ./keys/license.token:/licences/tokensvc.token:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8082/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    image: stevef1uk/agent-gateway-gateway:1.0.23  # 1.0.22 adds the egress forward proxy (GATEWAY_PROXY_ADDR, second listener on :8088) + approval cards carry the console deep-link on egress holds; 1.0.14 cards link to the console (APPROVAL_CONSOLE_URL); 1.0.7 webhook payload carries the real approval expiry; 1.0.6 Load() fix for webhook/approver envs; 1.0.5 approver binding (only the delegating user can approve) + approval.required webhook (HMAC-signed) + user_email routing claim; patched Go toolchain; 1.0.9 Telegram approval notifications (APPROVAL_TELEGRAM_BOT_TOKEN/CHAT_ID)
    container_name: agent-gateway-gateway
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    # GATEWAY_HOST_PORT overrides the published PEP port (default 8080) when
    # something else already owns :8080 on the host, e.g. an OpenShell gateway.
    ports: ["${GATEWAY_HOST_PORT:-8080}:8080", "8088:8088"]
    environment:
      - AUTHZ_URL=http://authz:8081
      - PERSISTENCE=postgres
      - DATABASE_URL=postgres://agentgw:agentgw@postgres:5432/agent_gateway?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=agent-gateway-demo-secret-change-in-prod
      - JWT_ISSUER=agent-gateway
      - GATEWAY_ADMIN_TOKEN=agent-gateway-demo-admin  # guards /v1/approvals + /v1/tokens/revoke (X-Admin-Token); rotate for anything real
      # Egress enforcement (OpenShell/OpenClaw): uncomment to route ALL of an
      # agent's outbound traffic through the gateway — one delegated, audited,
      # approval-gated decision per destination. See demo/egress-demo.sh and
      # docs/OpenShell guide in the main repo. Default: off (behaviour
      # unchanged from 1.0.21 unless enabled).
      # - GATEWAY_PROXY_ADDR=:8088
      # Real downstream: the demo protected API (executed_count proves how
      # often it ran). Remove to restore the gateway's synthetic echo.
      - UPSTREAM_URL=http://demoapi:8090
      # Telegram approval notifications: values come from demo/.env (gitignored)
      # exported via the shell env; empty = channel off. Run compose FROM THIS
      # DIRECTORY so demo/.env is picked up (or export the variables yourself).
      # If your host only has the standalone binary, use `docker-compose`
      # instead of `docker compose`.
      - APPROVAL_TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - APPROVAL_TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - APPROVAL_CONSOLE_URL=${APPROVAL_CONSOLE_URL:-}   # must be ROUTABLE by the recipient (Telegram rejects localhost in buttons)
      # - APPROVAL_WEBHOOK_URL=http://n8n:5678/webhook/agent-gateway   # push approval.required events (Deployment Guide §7.5 / product Deployment.md §7.5)
      # - APPROVAL_WEBHOOK_SECRET=<random 32 bytes>                    # HMAC-signs each delivery
      # - APPROVAL_TELEGRAM_BOT_TOKEN=<token from @BotFather>          # push approval.required to a Telegram chat (same event as the webhook)
      # - APPROVAL_TELEGRAM_CHAT_ID=<user or group id>
    volumes:
      - ./keys:/keys:ro
      - ./keys/license.token:/licences/gateway.token:ro
    depends_on:
      authz: { condition: service_started }
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  demoapi:
    image: ${DEMOAPI_IMAGE:-stevef1uk/agent-gateway-demoapi:1.0.4}  # source: demo/api (built from this repo; DEMOAPI_IMAGE to use your own registry)
    container_name: agent-gateway-demoapi
    restart: unless-stopped
    ports: ["8090:8090"]   # counter visible from the host: curl :8090/api/sensitive/wire
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8090/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    image: stevef1uk/agent-gateway-web:1.0.41  # 1.0.31 #approvals deep-link (notification cards land on the pending-approvals view); 1.0.30 IdP-proxy chooser/link fix (provider links stay under /oidc/idp even without a pinned connector); 1.0.27 decision approver = verified session subject (gateway enforces the binding); 1.0.26 in-page approval notifications (pending badge + toast); 1.0.19 session-gated console APIs (whoami identity, no readable token cookie) + CSP + demo kill switch; 1.0.20 non-root; 1.0.21 rate-limited /oidc/login; 1.0.22 expired-probe-delegation recovery; 1.0.23/24 console Sign out button; 1.0.25 demo step 1 auto-resumes after the SSO redirect; patched Go toolchain
    container_name: agent-gateway-web
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports: ["8083:8083"]
    environment:
      - AUTHZ_URL=http://authz:8081
      - GATEWAY_URL=http://gateway:8080
      - TOKENSVC_URL=http://tokensvc:8082
      - OIDC_ISSUER_URL=http://dex:5556/dex
      - OIDC_CLIENT_ID=agent-gateway
      - OIDC_CONNECTOR_ID=mock        # one-click sign-in for the demo
      - WEB_ADDR=:8083
      - GATEWAY_ADMIN_TOKEN=agent-gateway-demo-admin  # forwarded to the gateway's operator endpoints
      - DEMO_UI=1                     # serve the R&D pages (/demo.html, /policy.html); production omits this
    volumes:
      - ./keys:/keys:ro
      - ./keys/license.token:/licences/web.token:ro
    depends_on:
      authz: { condition: service_started }
      gateway: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8083/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agent-gateway-redis
    restart: unless-stopped
    # No published ports: only the gateway stack reaches redis, over the
    # compose network (publishing 6379 would expose it to the LAN).
    volumes: [redis-data:/data]
    command: ["redis-server", "--appendonly", "yes"]

  postgres:
    image: postgres:16-alpine
    container_name: agent-gateway-postgres
    restart: unless-stopped
    # No published ports: only the gateway stack reaches postgres, over the
    # compose network (publishing 5432 would expose it to the LAN).
    environment:
      - POSTGRES_USER=agentgw
      - POSTGRES_PASSWORD=agentgw
      - POSTGRES_DB=agent_gateway
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentgw -d agent_gateway"]
      interval: 5s
      timeout: 3s
      retries: 10

  dex:
    image: ghcr.io/dexidp/dex:v2.41.1
    container_name: agent-gateway-dex
    restart: unless-stopped
    ports: ["5556:5556"]
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro
    command: ["dex", "serve", "/etc/dex/config.yaml"]

volumes:
  redis-data:
  postgres-data:
