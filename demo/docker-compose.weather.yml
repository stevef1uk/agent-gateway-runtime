# Curl-only public API tutorial. Run from the repository root:
# DEX_ISSUER_URL=http://dex:5556/dex docker compose \
#   -f demo/docker-compose.yml -f demo/docker-compose.egress.yml \
#   -f demo/docker-compose.opa.yml -f demo/docker-compose.weather.yml \
#   up -d --wait tokensvc gateway-weather
services:
  gateway-weather:
    image: ${GATEWAY_IMAGE:-docker.io/stevef1uk/agent-gateway-gateway:1.0.36@sha256:2dce006ce0b53bdeb57525b3d993809fbc802a24e1dcfd39e46dde1a4ee72ce8}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports: ["127.0.0.1:${WEATHER_HOST_PORT:-8087}:8080"]
    environment:
      - AUTHZ_URL=http://authz:8081
      - AUTHZ_READ_TOKEN=${AUTHZ_READ_TOKEN:-agent-gateway-demo-authz-read}
      - PERSISTENCE=postgres
      - DATABASE_URL=postgres://agentgw:agentgw@postgres:5432/agent_gateway?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:?Set a high-entropy JWT_SECRET in demo/.env}
      - JWT_ISSUER=agent-gateway
      - GATEWAY_ADMIN_TOKEN=${GATEWAY_ADMIN_TOKEN:?Run ./ensure-secrets.sh from demo/}
      - APPROVAL_TTL=15m
      - UPSTREAM_URL=https://api.open-meteo.com
    volumes:
      - ./keys:/keys:ro
      - ./keys/license.token:/licences/gateway.token:ro
    depends_on:
      authz: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
