name: Sign AWS release images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign:
    if: github.ref == 'refs/heads/aws'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out AWS release manifest
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2

      - name: Install Cosign
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb
        with:
          cosign-release: v2.4.3

      - name: Sign immutable images from the current AWS release
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          : "${DOCKERHUB_USERNAME:?Set the repository Actions secret DOCKERHUB_USERNAME}"
          : "${DOCKERHUB_TOKEN:?Set the repository Actions secret DOCKERHUB_TOKEN}"

          jq -e '
            [.emotion.immutable_image, .images.authz.immutable_image,
             .images.tokensvc.immutable_image, .images.gateway.immutable_image,
             .images.web.immutable_image]
            | length == 5
              and all(.[]; type == "string" and
                test("^(docker[.]io/)?stevef1uk/agent-gateway-(emotion|authz|tokensvc|gateway|web)_l@sha256:[0-9a-f]{64}$"))
          ' releases/current.json >/dev/null

          mapfile -t images < <(jq -r '
            [.emotion.immutable_image, .images.authz.immutable_image,
             .images.tokensvc.immutable_image, .images.gateway.immutable_image,
             .images.web.immutable_image][]
          ' releases/current.json)

          for index in "${!images[@]}"; do
            if [[ "${images[$index]}" != docker.io/* ]]; then
              images[$index]="docker.io/${images[$index]}"
            fi
          done

          printf '%s' "$DOCKERHUB_TOKEN" |
            docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
          trap 'docker logout docker.io >/dev/null 2>&1 || true' EXIT

          for image in "${images[@]}"; do
            printf 'Signing %s\n' "$image"
            cosign sign --yes "$image"
            printf -- '- `%s`\n' "$image" >> "$GITHUB_STEP_SUMMARY"
          done
