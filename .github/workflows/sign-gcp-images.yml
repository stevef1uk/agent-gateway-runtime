name: Sign GCP release images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact published GCP image tag used for deployment (do not use latest)
        required: true
        type: string
      include_emotion:
        description: Also sign the Emotion image for this release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  sign:
    if: github.ref == 'refs/heads/gcp'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2

      - name: Install Cosign
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb
        with:
          cosign-release: v2.4.3

      - name: Resolve and sign the selected GCP image release
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          INCLUDE_EMOTION: ${{ inputs.include_emotion }}
        run: |
          set -euo pipefail
          : "${DOCKERHUB_USERNAME:?Set the repository Actions secret DOCKERHUB_USERNAME}"
          : "${DOCKERHUB_TOKEN:?Set the repository Actions secret DOCKERHUB_TOKEN}"
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ || "$VERSION" == latest ]]; then
            echo 'Enter an exact published version tag; the moving latest tag is not accepted.' >&2
            exit 1
          fi

          names=(gateway web)
          if [[ "$INCLUDE_EMOTION" == true ]]; then
            names+=(emotion)
          fi
          tagged_images=()
          for name in "${names[@]}"; do
            tagged_images+=("docker.io/stevef1uk/agent-gateway-${name}_g:$VERSION")
          done

          printf '%s' "$DOCKERHUB_TOKEN" |
            docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
          trap 'docker logout docker.io >/dev/null 2>&1 || true' EXIT

          immutable_images=()
          for image in "${tagged_images[@]}"; do
            if ! inspect_out="$(docker buildx imagetools inspect "$image" 2>&1)"; then
              printf 'Could not inspect %s:\n%s\n' "$image" "$inspect_out" >&2
              exit 1
            fi
            digest="$(printf '%s\n' "$inspect_out" | awk '$1 == "Digest:" { print $2; exit }')"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              printf 'Could not resolve a valid digest for %s\n' "$image" >&2
              exit 1
            fi
            immutable_images+=("${image%:*}@$digest")
          done

          for image in "${immutable_images[@]}"; do
            printf 'Signing %s\n' "$image"
            cosign sign --yes "$image"
            printf -- '- `%s`\n' "$image" >> "$GITHUB_STEP_SUMMARY"
          done
