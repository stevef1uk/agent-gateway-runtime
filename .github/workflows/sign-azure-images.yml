name: Sign Azure release images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign:
    if: github.ref == 'refs/heads/azure'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out Azure image configuration
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2

      - name: Install Cosign
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb
        with:
          cosign-release: v2.4.3

      - name: Sign immutable images from the Azure example configuration
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          : "${DOCKERHUB_USERNAME:?Set the repository Actions secret DOCKERHUB_USERNAME}"
          : "${DOCKERHUB_TOKEN:?Set the repository Actions secret DOCKERHUB_TOKEN}"

          jq -e '
            [.emotion_image, .images.authz, .images.tokensvc,
             .images.gateway, .images.web]
            | length == 5
              and all(.[]; type == "string" and
                test("^docker[.]io/stevef1uk/agent-gateway-(emotion|authz|tokensvc|gateway|web)_azure@sha256:[0-9a-f]{64}$"))
          ' deploy/azure/azure-config.example.json >/dev/null

          mapfile -t images < <(jq -r '
            [.emotion_image, .images.authz, .images.tokensvc,
             .images.gateway, .images.web][]
          ' deploy/azure/azure-config.example.json)

          printf '%s' "$DOCKERHUB_TOKEN" |
            docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
          trap 'docker logout docker.io >/dev/null 2>&1 || true' EXIT

          for image in "${images[@]}"; do
            printf 'Signing %s\n' "$image"
            cosign sign --yes "$image"
            printf -- '- `%s`\n' "$image" >> "$GITHUB_STEP_SUMMARY"
          done
