<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">Representative AWS zoned architecture with Agent Gateway</title>
  <desc id="desc">AI agents enter through an AWS public edge and frontend API gateway. Agent-governed requests pass through Agent Gateway's private policy enforcement point before reaching frontend, business, and data service APIs. Token minting and administration use separate routes; authorization and state services stay private.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .zone-title { font-size: 17px; font-weight: 700; }
      .zone-sub { font-size: 12px; fill: #475569; }
      .card-title { font-size: 15px; font-weight: 700; }
      .card-sub { font-size: 12px; fill: #475569; }
      .small { font-size: 11px; fill: #475569; }
      .flow { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .control { fill: none; stroke: #2563eb; stroke-width: 2.2; stroke-dasharray: 7 5; marker-end: url(#arrowBlue); }
      .private { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 5 5; marker-end: url(#arrowGray); }
    </style>
  </defs>
  <rect width="1600" height="1080" fill="#f8fafc"/>
  <text x="48" y="52" class="title">AWS · Agent Gateway in a zoned BFF/API architecture</text>
  <text x="48" y="80" class="subtitle">Representative request path: public frontend/API edge → Agent Gateway policy enforcement → private business and data APIs</text>

  <rect x="34" y="155" width="200" height="116" rx="18" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <text x="134" y="192" text-anchor="middle" class="card-title">Callers</text>
  <text x="134" y="218" text-anchor="middle" class="card-sub">AI agents / applications</text>
  <text x="134" y="239" text-anchor="middle" class="card-sub">Human administrators</text>

  <rect x="270" y="115" width="1284" height="210" rx="20" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="296" y="147" class="zone-title">AWS-managed public edge · outside the application subnets</text>
  <text x="296" y="168" class="zone-sub">Public endpoints terminate HTTPS here; route only the intended paths to private services.</text>
  <rect x="310" y="190" width="255" height="94" rx="13" fill="#fff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="437" y="222" text-anchor="middle" class="card-title">AWS WAF / edge controls</text>
  <text x="437" y="246" text-anchor="middle" class="card-sub">Attach to a supported public entry</text>
  <text x="437" y="266" text-anchor="middle" class="card-sub">TLS, filtering, rate controls</text>
  <rect x="620" y="190" width="455" height="94" rx="13" fill="#fff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="847" y="220" text-anchor="middle" class="card-title">Public API Gateway / frontend BFF entry</text>
  <text x="847" y="244" text-anchor="middle" class="card-sub">Client-facing APIs and agent routes</text>
  <text x="847" y="264" text-anchor="middle" class="card-sub">Private integration via VPC Link where applicable</text>
  <rect x="1110" y="190" width="405" height="94" rx="13" fill="#fff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="1312" y="220" text-anchor="middle" class="card-title">Route by purpose</text>
  <text x="1312" y="244" text-anchor="middle" class="card-sub">Agent API → PEP · /token → tokensvc</text>
  <text x="1312" y="264" text-anchor="middle" class="card-sub">Admin sign-in → web console</text>

  <path d="M234 213H302" class="flow"/>
  <path d="M565 237H610" class="flow"/>

  <rect x="270" y="365" width="1284" height="655" rx="22" fill="#fff" stroke="#64748b" stroke-width="2.5"/>
  <text x="296" y="398" class="zone-title">Customer VPC · private subnets across multiple Availability Zones</text>
  <rect x="1324" y="377" width="204" height="29" rx="14" fill="#e2e8f0"/>
  <text x="1426" y="397" text-anchor="middle" class="small">Replicas spread across AZs</text>

  <rect x="292" y="420" width="1238" height="204" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="314" y="449" class="zone-title">Agent Gateway zone · private application subnets</text>
  <text x="314" y="469" class="zone-sub">Only the public edge / approved agent networks can reach the required ingress routes.</text>

  <rect x="312" y="488" width="225" height="76" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="424" y="518" text-anchor="middle" class="card-title">Gateway PEP · :8080</text>
  <text x="424" y="541" text-anchor="middle" class="card-sub">Agent tool/API enforcement</text>

  <rect x="554" y="488" width="185" height="76" rx="12" fill="#fff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="646" y="518" text-anchor="middle" class="card-title">tokensvc · :8082</text>
  <text x="646" y="541" text-anchor="middle" class="card-sub">Agent token mint route</text>

  <rect x="756" y="488" width="180" height="76" rx="12" fill="#fff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="846" y="518" text-anchor="middle" class="card-title">authz · :8081</text>
  <text x="846" y="541" text-anchor="middle" class="card-sub">Private policy decisions</text>

  <rect x="953" y="488" width="175" height="76" rx="12" fill="#fff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="1040" y="518" text-anchor="middle" class="card-title">web · :8083</text>
  <text x="1040" y="541" text-anchor="middle" class="card-sub">Admin console</text>

  <rect x="1145" y="488" width="360" height="76" rx="12" fill="#fff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="1325" y="518" text-anchor="middle" class="card-title">Agent Gateway state</text>
  <text x="1325" y="541" text-anchor="middle" class="card-sub">Private PostgreSQL + Redis</text>

  <path d="M847 284V340H424V478" class="flow"/>
  <text x="469" y="350" class="small">VPC Link / private integration → internal target</text>
  <path d="M895 284V360H646V478" class="private"/>
  <path d="M990 284V375H1040V478" class="private"/>
  <path d="M537 526H746" class="control"/>
  <text x="637" y="514" text-anchor="middle" class="small">per-request decision</text>
  <path d="M739 550H746" class="control"/>
  <path d="M936 526H1135" class="private"/>
  <path d="M424 564V590H1325V574" class="private"/>

  <line x1="292" y1="643" x2="1530" y2="643" stroke="#dc2626" stroke-width="2" stroke-dasharray="10 7"/>
  <rect x="1142" y="629" width="365" height="28" rx="14" fill="#fee2e2" stroke="#f87171"/>
  <text x="1324" y="648" text-anchor="middle" class="small">Zone firewall policy · security groups / optional Network Firewall</text>
  <rect x="292" y="660" width="1238" height="147" rx="16" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
  <text x="314" y="689" class="zone-title">Frontend and Business Services API zone · private subnets</text>
  <rect x="317" y="707" width="300" height="76" rx="12" fill="#fff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="467" y="737" text-anchor="middle" class="card-title">Frontend / BFF APIs</text>
  <text x="467" y="760" text-anchor="middle" class="card-sub">Agent-governed operations enter via PEP</text>
  <rect x="657" y="707" width="325" height="76" rx="12" fill="#fff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="819" y="737" text-anchor="middle" class="card-title">Private backend API gateway</text>
  <text x="819" y="760" text-anchor="middle" class="card-sub">Private API / internal LB pattern as supported</text>
  <rect x="1022" y="707" width="482" height="76" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="1263" y="737" text-anchor="middle" class="card-title">Business Services APIs</text>
  <text x="1263" y="760" text-anchor="middle" class="card-sub">Private service endpoints; allow only approved callers</text>
  <path d="M424 564V695H467V697" class="flow"/>
  <path d="M617 745H647" class="flow"/>
  <path d="M982 745H1012" class="flow"/>

  <line x1="292" y1="825" x2="1530" y2="825" stroke="#dc2626" stroke-width="2" stroke-dasharray="10 7"/>
  <rect x="1142" y="811" width="365" height="28" rx="14" fill="#fee2e2" stroke="#f87171"/>
  <text x="1324" y="830" text-anchor="middle" class="small">Zone firewall policy · least-privilege east/west access</text>
  <rect x="292" y="842" width="1238" height="150" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="314" y="871" class="zone-title">Data Services API zone · private subnets</text>
  <rect x="317" y="891" width="440" height="76" rx="12" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/>
  <text x="537" y="921" text-anchor="middle" class="card-title">Data Services APIs</text>
  <text x="537" y="944" text-anchor="middle" class="card-sub">Governed service interfaces; no direct agent access</text>
  <rect x="797" y="891" width="707" height="76" rx="12" fill="#fff" stroke="#fb923c" stroke-width="1.5"/>
  <text x="1150" y="921" text-anchor="middle" class="card-title">Private data stores</text>
  <text x="1150" y="944" text-anchor="middle" class="card-sub">Only the data APIs / approved services can connect</text>
  <path d="M1263 783V881H537V881" class="flow"/>
  <path d="M757 929H787" class="flow"/>

  <rect x="34" y="430" width="200" height="135" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="134" y="461" text-anchor="middle" class="card-title">Agent path</text>
  <text x="134" y="487" text-anchor="middle" class="card-sub">Public API → AGW PEP</text>
  <text x="134" y="509" text-anchor="middle" class="card-sub">→ BFF → backend APIs</text>
  <text x="134" y="539" text-anchor="middle" class="small">Policy checked before forwarding</text>
  <rect x="34" y="605" width="200" height="135" rx="16" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="134" y="636" text-anchor="middle" class="card-title">Human / operator</text>
  <text x="134" y="662" text-anchor="middle" class="card-sub">OIDC → admin console</text>
  <text x="134" y="684" text-anchor="middle" class="card-sub">Delegations / approvals</text>
  <text x="134" y="714" text-anchor="middle" class="small">No public DB access</text>

  <rect x="270" y="1034" width="1284" height="30" rx="15" fill="#e2e8f0"/>
  <text x="912" y="1054" text-anchor="middle" class="small">Use security groups as workload boundaries; add AWS Network Firewall where centralized inspection is required. Diagram is conceptual, not a deployable network plan.</text>
</svg>
