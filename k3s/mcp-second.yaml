---
# MCP server 'second' — generated by add-mcp-server.sh. ClusterIP ONLY.
apiVersion: apps/v1
kind: Deployment
metadata: { name: mcp-second, namespace: agentgw, labels: { app: mcp-second } }
spec:
  replicas: 1
  selector: { matchLabels: { app: mcp-second } }
  template:
    metadata: { labels: { app: mcp-second } }
    spec:
      containers:
        - name: server
          image: stevef1uk/agent-gateway-mcpsrv:1.0.1
          ports: [{ containerPort: 8091 }]
---
apiVersion: v1
kind: Service
metadata: { name: mcp-second, namespace: agentgw }
spec:
  type: ClusterIP
  selector: { app: mcp-second }
  ports: [{ name: mcp, port: 8091, targetPort: 8091 }]
---
# PEP for 'second' — dedicated gateway instance, resource path /mcp-second*.
apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway-mcp-second, namespace: agentgw, labels: { app: gateway-mcp-second } }
spec:
  replicas: 1
  selector: { matchLabels: { app: gateway-mcp-second } }
  template:
    metadata: { labels: { app: gateway-mcp-second } }
    spec:
      containers:
        - name: pep
          image: stevef1uk/agent-gateway-gateway_m:1.0.31
          ports: [{ containerPort: 8080 }]
          env:
            - { name: AUTHZ_URL, value: "http://authz:8081" }
            - { name: PERSISTENCE, value: postgres }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: agentgw-secrets, key: POSTGRES_PASSWORD } }
            - name: DATABASE_URL
              value: "postgres://agentgw:$(POSTGRES_PASSWORD)@postgres:5432/agent_gateway?sslmode=disable"
            - { name: REDIS_URL, value: "redis://redis:6379/0" }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: agentgw-secrets, key: JWT_SECRET } }
            - name: GATEWAY_ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: agentgw-secrets, key: GATEWAY_ADMIN_TOKEN } }
            - { name: OAUTH_ENABLED, value: "1" }
            - { name: OAUTH_ISSUER_URL, value: "https://agw.sjfisher.com" }
            - { name: OIDC_ISSUER_URL, value: "http://dex:5556/dex" }
            - { name: OIDC_CLIENT_ID, value: "agent-gateway" }
            - { name: OIDC_CONNECTOR_ID, value: "mock" }
            - { name: UPSTREAM_URL, value: "http://mcp-second:8091" }
            - name: APPROVAL_TELEGRAM_BOT_TOKEN
              valueFrom: { secretKeyRef: { name: agentgw-telegram, key: bot_token, optional: true } }
            - name: APPROVAL_TELEGRAM_CHAT_ID
              valueFrom: { secretKeyRef: { name: agentgw-telegram, key: chat_id, optional: true } }
            - { name: APPROVAL_CONSOLE_URL, value: "https://agw.sjfisher.com" }
          volumeMounts:
            - { name: licence, mountPath: /licences/gateway.token, subPath: gateway.token, readOnly: true }
            - { name: keys, mountPath: /keys, readOnly: true }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 8
      volumes:
        - name: licence
          secret: { secretName: agentgw-keys, items: [{ key: license.token, path: gateway.token }] }
        - name: keys
          secret: { secretName: agentgw-keys, items: [{ key: customer_private.pem, path: customer_private.pem }] }
---
apiVersion: v1
kind: Service
metadata: { name: gateway-mcp-second, namespace: agentgw }
spec:
  type: ClusterIP
  selector: { app: gateway-mcp-second }
  ports: [{ name: pep, port: 8080, targetPort: 8080 }]
