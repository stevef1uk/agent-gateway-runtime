# Agent Gateway on k3s — single manifest, namespace agentgw.
#
# Storage follows the shared-Gluster pattern: one ReadWriteMany PV on the
# cluster file system (/mnt/clustervol/k8s/agentgw, DirectoryOrCreate), one
# PVC, and subPath mounts so each consumer gets its own directory:
#   postgres/  — database files
#   redis/     — append-only store
#   policies/  — the live OPA policy: web (playground) writes it,
#                authz (engine) watches and serves it — any node
#
# Managed image prerequisite (secrets are NOT in this file): create
# agentgw-keys from the hosted private key in the private source repo and a
# fresh vendor-signed licence. Never use demo/keys for these _m images and
# never copy hosted key material to the public demo repo.
# Do not apply publicly until trusted OIDC and agentgw-web-admin are ready.
#
# Endpoints after rollout (NodePort on any node, e.g. 192.168.1.74):
#   console  http://<node>:30083   (public approvals; operator signup review)
#   gateway  http://<node>:30080   (agents; X-Admin-Token operator API)
---
apiVersion: v1
kind: Namespace
metadata:
  name: agentgw
---
apiVersion: v1
kind: Secret
metadata:
  name: agentgw-secrets
  namespace: agentgw
stringData:
  # OUT-OF-BOX DEMO DEFAULTS ONLY. They are published in this repo on
  # purpose (so `kubectl apply` just works); a LIVE instance that accepts
  # outsider traffic (NodePort 30080 admin API, tokensvc 30082) MUST
  # override them — random JWT_SECRET + GATEWAY_ADMIN_TOKEN:
  #   kubectl -n agentgw patch secret agentgw-secrets -p \
  #     '{"stringData":{"JWT_SECRET":"<openssl rand -hex 32>","GATEWAY_ADMIN_TOKEN":"<openssl rand -hex 16>"}}'
  #   then restart gateway, gateway-mcp, authz, tokensvc, web
  JWT_SECRET: "agent-gateway-demo-secret-change-in-prod"   # demo-grade: rotate
  GATEWAY_ADMIN_TOKEN: "agent-gateway-demo-admin"          # demo-grade: rotate
  POSTGRES_PASSWORD: "agentgw"                             # internal only — postgres is ClusterIP, never published
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: agentgw-shared-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: gluster-shared
  hostPath:
    path: /mnt/clustervol/k8s/agentgw
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentgw-shared-pvc
  namespace: agentgw
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: gluster-shared
  resources:
    requests:
      storage: 10Gi
  volumeName: agentgw-shared-pv
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dex-config
  namespace: agentgw
data:
  config.yaml: |
    issuer: http://dex:5556/dex
    storage:
      type: memory
    web:
      http: 0.0.0.0:5556
    oauth2:
      skipApprovalScreen: true
      passwordConnector: local
    staticClients:
      - id: agent-gateway
        name: Agent Gateway
        public: true
        redirectURIs:
          - http://localhost:30083/oidc/callback
          - http://127.0.0.1:30083/oidc/callback
          - http://192.168.1.74:30083/oidc/callback
          - http://192.168.1.53:30083/oidc/callback
          - http://192.168.1.45:30083/oidc/callback
          - http://192.168.1.63:30083/oidc/callback
          - http://host.docker.internal:30083/oidc/callback
          - https://agw.sjfisher.com/oidc/callback
          # MCP One Ring OAuth connector callback (gateway-mcp via ingress)
          - https://agw.sjfisher.com/oauth/idpcallback
    enablePasswordDB: true
    staticPasswords:
      - email: "alice@example.com"
        hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
        username: "alice"
        userID: "alice"
    connectors: []
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: agentgw
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      nodeSelector: { kubernetes.io/hostname: rpi58 }
      initContainers:
        - name: volume-ownership
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /data/pgdata && chown -R 70:70 /data"]
          volumeMounts: [{ name: data, mountPath: /data }]
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER, value: agentgw }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: agentgw-secrets, key: POSTGRES_PASSWORD } }
            - { name: POSTGRES_DB, value: agent_gateway }
            - { name: PGDATA, value: /data/pgdata }
          ports: [{ containerPort: 5432 }]
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "agentgw", "-d", "agent_gateway"] }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          hostPath: { path: /srv/agentgw/postgres, type: DirectoryOrCreate }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: agentgw
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: agentgw
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      nodeSelector: { kubernetes.io/hostname: rpi58 }
      initContainers:
        - name: volume-ownership
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /data && chown -R 999:1000 /data"]
          volumeMounts: [{ name: data, mountPath: /data }]
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports: [{ containerPort: 6379 }]
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: data
          hostPath: { path: /srv/agentgw/redis, type: DirectoryOrCreate }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: agentgw
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  namespace: agentgw
spec:
  replicas: 1
  selector: { matchLabels: { app: dex } }
  template:
    metadata: { labels: { app: dex } }
    spec:
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.46.0
          args: ["dex", "serve", "/etc/dex/config.yaml"]
          ports: [{ containerPort: 5556 }]
          volumeMounts:
            - { name: config, mountPath: /etc/dex }
      volumes:
        - name: config
          configMap: { name: dex-config }
---
apiVersion: v1
kind: Service
metadata:
  name: dex
  namespace: agentgw
spec:
  selector: { app: dex }
  ports: [{ port: 5556, targetPort: 5556 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demoapi
  namespace: agentgw
spec:
  replicas: 1
  selector: { matchLabels: { app: demoapi } }
  template:
    metadata: { labels: { app: demoapi } }
    spec:
      containers:
        - name: demoapi
          image: stevef1uk/agent-gateway-demoapi:1.0.6   # plain image: the customer's own API; kubectl logs shows a line per EXECUTED call; source at demo/api; change the ref to your own registry if you build it yourself
          ports: [{ containerPort: 8090 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8090 }
            initialDelaySeconds: 3
      volumes: []
---
apiVersion: v1
kind: Service
metadata:
  name: demoapi
  namespace: agentgw
spec:
  selector: { app: demoapi }
  ports: [{ port: 8090, targetPort: 8090 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authz
  namespace: agentgw
spec:
  replicas: 1
  selector: { matchLabels: { app: authz } }
  template:
    metadata: { labels: { app: authz } }
    spec:
      containers:
        - name: authz
          image: stevef1uk/agent-gateway-authz_m:1.0.16
          ports: [{ containerPort: 8081 }]
          env:
            - { name: PERSISTENCE, value: postgres }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: agentgw-secrets, key: POSTGRES_PASSWORD } }
            - name: DATABASE_URL
              value: "postgres://agentgw:$(POSTGRES_PASSWORD)@postgres:5432/agent_gateway?sslmode=disable" 
            - { name: REDIS_URL, value: "redis://redis:6379/0" }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: agentgw-secrets, key: JWT_SECRET } }
            - { name: OIDC_ISSUER_URL, value: "http://dex:5556/dex" }
            - { name: OIDC_CLIENT_ID, value: agent-gateway }
            # One-click mock sign-in (compose-demo parity); omit to show Dex's
            # connector chooser — its links are proxied correctly since 1.0.30.
            - { name: OIDC_CONNECTOR_ID, value: local }
            - { name: AUTHZ_POLICY_ENGINE, value: opa }
            - { name: OPA_POLICY_PATH, value: /policy/authorizer.rego }
          volumeMounts:
            - { name: keys, mountPath: /keys, readOnly: true }
            - { name: licence, mountPath: /licences/authz.token, subPath: authz.token, readOnly: true }
            - { name: policies, mountPath: /policy, readOnly: true }
          readinessProbe:
            httpGet: { path: /healthz, port: 8081 }
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: keys
          secret: { secretName: agentgw-keys, items: [{ key: customer_private.pem, path: customer_private.pem }] }
        - name: licence
          secret: { secretName: agentgw-keys, items: [{ key: license.token, path: authz.token }] }
        - name: policies
          persistentVolumeClaim: { claimName: agentgw-shared-pvc }
---
apiVersion: v1
kind: Service
metadata:
  name: authz
  namespace: agentgw
spec:
  type: NodePort   # delegations are created at the decision point directly
  selector: { app: authz }
  ports: [{ port: 8081, targetPort: 8081, nodePort: 30081 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tokensvc
  namespace: agentgw
spec:
  replicas: 1
  selector: { matchLabels: { app: tokensvc } }
  template:
    metadata: { labels: { app: tokensvc } }
    spec:
      containers:
        - name: tokensvc
          image: stevef1uk/agent-gateway-tokensvc_m:1.0.8
          ports: [{ containerPort: 8082 }]
          env:
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: agentgw-secrets, key: JWT_SECRET } }
            - { name: AUTHZ_URL, value: "http://authz:8081" }
          volumeMounts:
            - { name: keys, mountPath: /keys, readOnly: true }
            - { name: licence, mountPath: /licences/tokensvc.token, subPath: tokensvc.token, readOnly: true }
          readinessProbe:
            httpGet: { path: /healthz, port: 8082 }
            initialDelaySeconds: 8
            periodSeconds: 5
      volumes:
        - name: keys
          secret: { secretName: agentgw-keys, items: [{ key: customer_private.pem, path: customer_private.pem }] }
        - name: licence
          secret: { secretName: agentgw-keys, items: [{ key: license.token, path: tokensvc.token }] }
---
apiVersion: v1
kind: Service
metadata:
  name: tokensvc
  namespace: agentgw
spec:
  type: NodePort   # agents mint against this directly (like gateway:30080)
  selector: { app: tokensvc }
  ports: [{ port: 8082, targetPort: 8082, nodePort: 30082 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: agentgw
spec:
  replicas: 1
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      containers:
        - name: gateway
          # images >= gateway 1.0.22 add the egress forward proxy
          # (GATEWAY_PROXY_ADDR). 1.0.22 ships after local validation —
          # publish with: make push-gateway ALLOW_PUSH=yes
          image: stevef1uk/agent-gateway-gateway_m:1.0.37
          ports: [{ containerPort: 8080 }, { containerPort: 8088 }]
          env:
            - { name: AUTHZ_URL, value: "http://authz:8081" }
            # egress proxy: every outbound call an agent (e.g. an OpenShell
            # sandbox / OpenClaw) makes becomes one delegated, audited,
            # approval-gated decision. Sandboxes point at
            # http://<node>:30088 as their upstream HTTP proxy.
            - { name: GATEWAY_PROXY_ADDR, value: ":8088" }
            - { name: PERSISTENCE, value: postgres }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: agentgw-secrets, key: POSTGRES_PASSWORD } }
            - name: DATABASE_URL
              value: "postgres://agentgw:$(POSTGRES_PASSWORD)@postgres:5432/agent_gateway?sslmode=disable" 
            - { name: REDIS_URL, value: "redis://redis:6379/0" }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: agentgw-secrets, key: JWT_SECRET } }
            - name: GATEWAY_ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: agentgw-secrets, key: GATEWAY_ADMIN_TOKEN } }
            # - { name: APPROVAL_WEBHOOK_URL, value: "https://…" }   # Deployment.md §7.5
            # - { name: APPROVAL_WEBHOOK_SECRET, value: "…" }
            # Telegram approval notifications: values live IN CLUSTER ONLY —
            # create the secret with kubectl (values never enter git):
            #   kubectl -n agentgw create secret generic agentgw-telegram \
            #     --from-literal=bot_token=<@BotFather token> \
            #     --from-literal=chat_id=<user or group id>
            - name: APPROVAL_TELEGRAM_BOT_TOKEN
              valueFrom: { secretKeyRef: { name: agentgw-telegram, key: bot_token, optional: true } }
            - name: APPROVAL_TELEGRAM_CHAT_ID
              valueFrom: { secretKeyRef: { name: agentgw-telegram, key: chat_id, optional: true } }
            - name: APPROVAL_CONSOLE_URL
              value: "http://192.168.1.74:30083"   # notification cards link here (node-exposed console)
            - { name: UPSTREAM_URL, value: "http://demoapi:8090" }   # the protected API the gateway forwards to
          volumeMounts:
            - { name: keys, mountPath: /keys, readOnly: true }
            - { name: licence, mountPath: /licences/gateway.token, subPath: gateway.token, readOnly: true }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 8
            periodSeconds: 5
      volumes:
        - name: keys
          secret: { secretName: agentgw-keys, items: [{ key: customer_private.pem, path: customer_private.pem }] }
        - name: licence
          secret: { secretName: agentgw-keys, items: [{ key: license.token, path: gateway.token }] }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: agentgw
spec:
  type: NodePort
  selector: { app: gateway }
  ports:
    - name: pep
      port: 8080
      targetPort: 8080
      nodePort: 30080
    - name: egress-proxy
      port: 8088
      targetPort: 8088
      nodePort: 30088   # egress proxy (gateways OpenShell sandboxes)
---
# ============================================================================
# Demo 9 / MCP One Ring on k3s — the CRM MCP server (ClusterIP ONLY: an MCP
# server reachable without the gateway is ungoverned) and a DEDICATED gateway
# instance (1.0.28: OAuth layer + per-tool MCP enforcement) for MCP traffic.
# Browser/Claude-facing routing goes through the ingress below.
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcpsrv
  namespace: agentgw
spec:
  replicas: 1
  selector: { matchLabels: { app: mcpsrv } }
  template:
    metadata: { labels: { app: mcpsrv } }
    spec:
      containers:
        - name: mcpsrv
          image: stevef1uk/agent-gateway-mcpsrv:1.0.1   # adds find_customer + delete_customer tools
          env:
            - { name: MCP_HOST, value: "0.0.0.0" }
            - { name: MCP_PORT, value: "8091" }
          ports: [{ containerPort: 8091 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8091 }
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mcpsrv
  namespace: agentgw
spec:
  type: ClusterIP          # deliberately NOT a NodePort/LoadBalancer
  selector: { app: mcpsrv }
  ports:
    - name: mcp
      port: 8091
      targetPort: 8091
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-mcp
  namespace: agentgw
spec:
  replicas: 1
  selector: { matchLabels: { app: gateway-mcp } }
  template:
    metadata: { labels: { app: gateway-mcp } }
    spec:
      containers:
        - name: gateway-mcp
          image: stevef1uk/agent-gateway-gateway_m:1.0.37  # managed OAuth layer + per-tool MCP enforcement
          ports: [{ containerPort: 8080 }]
          env:
            - { name: AUTHZ_URL, value: "http://authz:8081" }
            - { name: PERSISTENCE, value: postgres }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: agentgw-secrets, key: POSTGRES_PASSWORD } }
            - name: DATABASE_URL
              value: "postgres://agentgw:$(POSTGRES_PASSWORD)@postgres:5432/agent_gateway?sslmode=disable"
            - { name: REDIS_URL, value: "redis://redis:6379/0" }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: agentgw-secrets, key: JWT_SECRET } }
            - name: GATEWAY_ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: agentgw-secrets, key: GATEWAY_ADMIN_TOKEN } }
            # MCP One Ring OAuth layer: the issuer is the PUBLIC HTTPS name —
            # browsers (and claude.ai) reach the gateway through the ingress.
            - { name: OAUTH_ENABLED, value: "1" }
            - { name: OAUTH_ISSUER_URL, value: "https://agw.sjfisher.com" }
            - { name: OIDC_ISSUER_URL, value: "http://dex:5556/dex" }
            - { name: OIDC_CLIENT_ID, value: "agent-gateway" }
            - { name: OIDC_CONNECTOR_ID, value: "local" }
            - { name: UPSTREAM_URL, value: "http://mcpsrv:8091" }   # the CRM MCP server — never published
            - name: APPROVAL_TELEGRAM_BOT_TOKEN
              valueFrom: { secretKeyRef: { name: agentgw-telegram, key: bot_token, optional: true } }
            - name: APPROVAL_TELEGRAM_CHAT_ID
              valueFrom: { secretKeyRef: { name: agentgw-telegram, key: chat_id, optional: true } }
            - { name: APPROVAL_CONSOLE_URL, value: "https://agw.sjfisher.com" }   # Telegram button deep link (must be externally routable)
          volumeMounts:
            - { name: licence, mountPath: /licences/gateway.token, subPath: gateway.token, readOnly: true }
            - { name: keys, mountPath: /keys, readOnly: true }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 8
            periodSeconds: 5
      volumes:
        - name: licence
          secret: { secretName: agentgw-keys, items: [{ key: license.token, path: gateway.token }] }
        - name: keys
          secret: { secretName: agentgw-keys, items: [{ key: customer_private.pem, path: customer_private.pem }] }
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 1
              preference:
                matchExpressions:
                  - { key: kubernetes.io/hostname, operator: In, values: [rpi58] }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-mcp
  namespace: agentgw
spec:
  type: ClusterIP
  selector: { app: gateway-mcp }
  ports:
    - name: pep
      port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentgw-ingress
  namespace: agentgw
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: agw.sjfisher.com
      http:
        paths:
          # Claude's connector + Inspector: the MCP wire + OAuth discovery/flow
          - { path: /mcp, pathType: Prefix, backend: { service: { name: gateway-mcp, port: { number: 8080 } } } }
          - { path: /oauth, pathType: Prefix, backend: { service: { name: gateway-mcp, port: { number: 8080 } } } }
          - { path: /.well-known, pathType: Prefix, backend: { service: { name: gateway-mcp, port: { number: 8080 } } } }
          # the console under the same externally-routable name (one LE cert):
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 8083 } } } }
  tls:
    - hosts: [agw.sjfisher.com]
      secretName: agentgw-tls
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: agentgw
spec:
  replicas: 1                     # console sessions are in-memory: single replica
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      initContainers:
        - name: seed-policy
          image: stevef1uk/agent-gateway-web_m:1.0.69
          # The shared Gluster file system root-squashes, and pods may run as an
          # unprivileged uid, so the console runs as root (squashed to `nobody`
          # by the share — the same owner the first seed created files with).
          # Non-squashed volumes can drop this override.
          securityContext: { runAsUser: 0 }
          command: ["sh", "-c", "ls -la /policies; test -f /policies/authorizer.rego || cp /app/default-policy.rego /policies/authorizer.rego; chmod 666 /policies/authorizer.rego; ls -la /policies; exit 0"]
          volumeMounts: [{ name: policies, mountPath: /policies }]
      containers:
        - name: web
          image: stevef1uk/agent-gateway-web_m:1.0.69
          securityContext: { runAsUser: 0 }
          ports: [{ containerPort: 8083 }]
          env:
            - { name: AUTHZ_URL, value: "http://authz:8081" }
            - { name: GATEWAY_URL, value: "http://gateway:8080" }
            - { name: TOKENSVC_URL, value: "http://tokensvc:8082" }
            # Do not roll out publicly until the Dex mock above is replaced
            # with trusted OIDC and this allowlist Secret is provisioned.
            - { name: OIDC_ISSUER_URL, value: "http://dex:5556/dex" }
            - { name: OIDC_CLIENT_ID, value: agent-gateway }
            # One-click mock sign-in (compose-demo parity); omit to show Dex's
            # connector chooser — its links are proxied correctly since 1.0.30.
            - { name: OIDC_CONNECTOR_ID, value: local }
            - name: GATEWAY_ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: agentgw-secrets, key: GATEWAY_ADMIN_TOKEN } }
            - { name: WEB_PUBLIC_CONSOLE, value: "1" }
            - { name: DEMO_UI, value: "0" }
            - name: WEB_ADMIN_EMAILS
              valueFrom: { secretKeyRef: { name: agentgw-web-admin, key: emails } }
            - { name: PUBLIC_GATEWAY_URL, value: "http://192.168.1.74:30080" }  # agents reach the gateway here
            - { name: POLICY_FILE, value: /policies/authorizer.rego }
            - { name: POLICY_DEFAULT_FILE, value: /app/default-policy.rego }
          volumeMounts:
            - { name: keys, mountPath: /keys, readOnly: true }
            - { name: licence, mountPath: /licences/web.token, subPath: web.token, readOnly: true }
            - { name: policies, mountPath: /policies }
          readinessProbe:
            httpGet: { path: /healthz, port: 8083 }
            initialDelaySeconds: 8
            periodSeconds: 5
      volumes:
        - name: keys
          secret: { secretName: agentgw-keys, items: [{ key: customer_private.pem, path: customer_private.pem }] }
        - name: licence
          secret: { secretName: agentgw-keys, items: [{ key: license.token, path: web.token }] }
        - name: policies
          persistentVolumeClaim: { claimName: agentgw-shared-pvc }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: agentgw
spec:
  type: NodePort
  selector: { app: web }
  ports: [{ port: 8083, targetPort: 8083, nodePort: 30083 }]
